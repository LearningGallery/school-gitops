# No credentials here. External Secrets runs with an EKS Pod Identity role (school-infra/modules/secrets)
# that may read only secrets named school/* and the RDS-managed master secrets.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
