apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: school-alerting
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: school-alerting
    creationPolicy: Owner
  data:
    - secretKey: pagerduty_routing_key
      remoteRef: {key: school/alerting, property: pagerduty_routing_key}
    - secretKey: slack_webhook_url
      remoteRef: {key: school/alerting, property: slack_webhook_url}
