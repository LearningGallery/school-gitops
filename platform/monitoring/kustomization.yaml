apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheusrule.yaml
  - alertmanagerconfig.yaml
  - externalsecret.yaml
configMapGenerator:
  - name: school-golden-signals-dashboard
    namespace: monitoring
    files:
      - school-golden-signals.json=dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1" # the Grafana sidecar loads ConfigMaps with this label
        app.kubernetes.io/part-of: school
