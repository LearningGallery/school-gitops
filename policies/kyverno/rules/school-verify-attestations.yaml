# Admission-time proof that an image was built by OUR release workflow (module 11). Promotion already ran
# `gh attestation verify`; this repeats the check where it cannot be skipped: at the cluster door.
# NOT exercised offline: it needs a registry and a transparency log. Start with validationActions: [Audit].
# Attestor names are CEL identifiers: a hyphen (release-workflow) is read as subtraction and Kyverno rejects the policy.
# Caveat: attestations from PRIVATE repositories are signed under GitHub's own trust root, not the public
# Sigstore instance, so the attestor below needs adjusting for private repos (see module 15).
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: school-verify-attestations
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  # Read the attestations from our private ECR with the pod's AWS identity (an EKS Pod Identity role with read-only
  # access to the school-* repositories, see school-infra: enable_kyverno_ecr_access).
  credentials:
    providers: [amazon]
  matchImageReferences:
    - glob: "*.dkr.ecr.*.amazonaws.com/school-*"
  attestors:
    - name: release_workflow
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/<YOUR_ORG>/school-app/.github/workflows/release.yml@refs/heads/main
        ctlog:
          url: https://rekor.sigstore.dev
  attestations:
    - name: provenance
      intoto:
        type: https://slsa.dev/provenance/v1
  validations:
    - expression: >-
        images.containers.map(image, verifyAttestationSignatures(image, attestations.provenance, [attestors.release_workflow])).all(e, e > 0)
      message: "Image has no valid provenance attestation from the release workflow."
