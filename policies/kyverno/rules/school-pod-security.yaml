apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: school-pod-security
  annotations:
    policies.kyverno.io/title: Hardened containers
    policies.kyverno.io/description: >-
      Defence in depth next to the namespace Pod Security Admission label. Non-root, no privilege escalation, read-only root filesystem, all capabilities dropped, no privileged containers, no host namespaces.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  autogen:
    podControllers:
      controllers: [deployments, jobs]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c, has(c.securityContext) &&
          c.securityContext.?allowPrivilegeEscalation.orValue(true) == false &&
          c.securityContext.?readOnlyRootFilesystem.orValue(false) == true &&
          (c.securityContext.?runAsNonRoot.orValue(false) || object.spec.?securityContext.?runAsNonRoot.orValue(false)) &&
          c.securityContext.?capabilities.?drop.orValue([]).exists(d, d == 'ALL'))
      message: "Containers must run as non-root with a read-only root filesystem, no privilege escalation and ALL capabilities dropped."
    - expression: >-
        !object.spec.?hostNetwork.orValue(false) && !object.spec.?hostPID.orValue(false) && !object.spec.?hostIPC.orValue(false) &&
        variables.containers.all(c, !c.?securityContext.?privileged.orValue(false))
      message: "Privileged containers and host namespaces are not allowed."
