apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: school-restrict-images
  annotations:
    policies.kyverno.io/title: Images come from our registry and are pinned by digest
    policies.kyverno.io/description: >-
      A tag can be repointed; a digest cannot. Only images from our private ECR, referenced by digest, may run.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  autogen:
    podControllers:
      controllers: [deployments, jobs]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c, c.image.matches('^[0-9]{12}\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com/school-(backend|frontend)@sha256:[a-f0-9]{64}$'))
      message: "Images must come from the school ECR registry and be referenced by digest (name@sha256:...), never by tag."
