apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rules
# Scope every policy to our application namespaces (the overlays label them school/environment) so platform
# namespaces such as kube-system are never evaluated. Kept out of rules/ because the Kyverno CLI cannot
# evaluate namespaceSelector offline: the tests exercise the rule logic, the cluster applies the scope.
patches:
  - target:
      group: policies.kyverno.io
      kind: ".*ValidatingPolicy"
    patch: |-
      - op: add
        path: /spec/matchConstraints/namespaceSelector
        value:
          matchExpressions:
            - {key: school/environment, operator: Exists}
