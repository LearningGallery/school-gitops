apiVersion: v1
kind: Pod
metadata:
  name: good
  namespace: school-dev
  labels: {app.kubernetes.io/name: school-backend, app.kubernetes.io/part-of: school}
spec:
  containers:
    - name: app
      image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/school-backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {memory: 256Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities: {drop: [ALL]}
---
