# The deployment decision, made by metrics instead of by someone watching a dashboard (module 24).
# Pods are told apart by the rollouts-pod-template-hash label, exposed as rollouts_pod_template_hash by the PodMonitor.
# Every condition accepts an empty result: a canary that has received no traffic yet is not failing.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: school-backend-health
spec:
  args:
    - name: namespace
    - name: canary-hash
  metrics:
    - name: error-ratio
      interval: 1m
      count: 5
      failureLimit: 1
      successCondition: len(result) == 0 || isNaN(result[0]) || result[0] <= 0.01
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            sum(rate(http_requests_total{namespace="{{args.namespace}}",rollouts_pod_template_hash="{{args.canary-hash}}",status=~"5.."}[2m]))
            /
            sum(rate(http_requests_total{namespace="{{args.namespace}}",rollouts_pod_template_hash="{{args.canary-hash}}"}[2m]))
    - name: latency-p95-seconds
      interval: 1m
      count: 5
      failureLimit: 1
      successCondition: len(result) == 0 || isNaN(result[0]) || result[0] <= 0.5
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{namespace="{{args.namespace}}",rollouts_pod_template_hash="{{args.canary-hash}}"}[2m])))
    # The business signal: a release that is "healthy" to Kubernetes but breaks enrolment must still stop.
    - name: enrollment-failures
      interval: 1m
      count: 5
      failureLimit: 1
      successCondition: len(result) == 0 || isNaN(result[0]) || result[0] <= 5
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            sum(increase(enrollment_failures_total{namespace="{{args.namespace}}",rollouts_pod_template_hash="{{args.canary-hash}}"}[5m]))
