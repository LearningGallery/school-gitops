# Runs the SAME image as the API, so the schema change ships in the exact artifact being deployed.
# A Sync hook in wave 1: after the secret exists (wave 0), before the Deployments roll (wave 2).
# If this Job fails, the sync stops and the old pods keep serving.
apiVersion: batch/v1
kind: Job
metadata:
  name: school-migrate
  labels:
    app.kubernetes.io/name: school-migrate
    app.kubernetes.io/part-of: school
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: school-migrate
        app.kubernetes.io/part-of: school
    spec:
      restartPolicy: Never
      serviceAccountName: school-backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: school-backend
          command: ["node", "node_modules/node-pg-migrate/bin/node-pg-migrate.js", "up", "-m", "database/migrations"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: school-app
                  key: DATABASE_URL
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
