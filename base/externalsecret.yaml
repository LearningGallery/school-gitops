# The application never sees the RDS master password in Git. External Secrets reads it from AWS Secrets Manager
# (through EKS Pod Identity) and builds the Kubernetes Secret. Overlays set the real secret names and database host.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: school-app
  labels:
    app.kubernetes.io/part-of: school
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: school-app
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .db_username }}:{{ .db_password | urlquery }}@db.example.internal:5432/school?sslmode=require"
        JWT_SECRET: "{{ .jwt_secret }}"
  data:
    - secretKey: jwt_secret
      remoteRef: {key: school/ENV/app, property: jwt_secret}
    - secretKey: db_username
      remoteRef: {key: rds-master-secret-name, property: username}
    - secretKey: db_password
      remoteRef: {key: rds-master-secret-name, property: password}
