# Replaces the image's /etc/nginx/conf.d/default.conf in Kubernetes. The image config also proxies /api/ to a host named
# "backend" (the docker compose service name); nginx resolves that name at start-up and exits when it does not exist.
# Here the ALB sends /api/* straight to the backend Service, so the proxy block is not needed.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
  }

  location / {
    try_files $uri /index.html;
  }
}
