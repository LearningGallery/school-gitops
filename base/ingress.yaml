apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: school
  labels:
    app.kubernetes.io/part-of: school
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-1:123456789012:certificate/00000000-0000-0000-0000-000000000000
    alb.ingress.kubernetes.io/load-balancer-attributes: routing.http.drop_invalid_header_fields.enabled=true
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
spec:
  ingressClassName: alb
  rules:
    - host: school.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              # use-annotation: the Rollouts controller writes the weighted forward action for this Service name
              service: {name: school-backend, port: {name: use-annotation}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: school-frontend, port: {name: http}}
