apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: school
  namespace: argocd
spec:
  description: School Management System, all environments
  sourceRepos:
    - https://github.com/<YOUR_ORG>/school-gitops.git
  destinations:
    - {server: https://kubernetes.default.svc, namespace: school-dev}
    - {server: https://kubernetes.default.svc, namespace: school-staging}
  # Only Namespaces may be created at cluster scope. An application cannot grant itself cluster-admin.
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
