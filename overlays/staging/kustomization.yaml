apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: school-staging
resources:
  - ../../base
  - namespace.yaml
labels:
  - pairs:
      school/environment: staging
    includeSelectors: false
# Build once, deploy many: the SAME digests move dev -> staging. Only a promotion pull request edits these.
# The all-zero digests are placeholders; scripts/set_image.py writes real ones.
images:
  - name: school-backend
    newName: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/school-backend
    digest: sha256:0ae4384e2dd3c0255137993595ecafb6cef195af35cacb746c893420cb324d10
  - name: school-frontend
    newName: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/school-frontend
    digest: sha256:2f197a03ce1c2c4fc8be2d9de3047e894c21be6dc016df753f7a36d2b6a1ab0c
patches:
  - target: {kind: Rollout, name: school-backend}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: {kind: Rollout, name: school-frontend}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: {kind: Ingress, name: school}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.school.example.com
  - target: {kind: ConfigMap, name: school-config}
    patch: |-
      - op: replace
        path: /data/FLAG_GRADE_LETTERS
        value: "false"
  - target: {kind: Rollout, name: school-backend}
    patch: |-
      - op: replace
        path: /spec/strategy/canary/analysis/args/0/value
        value: school-staging
  - target: {kind: Rollout, name: school-frontend}
    patch: |-
      - op: replace
        path: /spec/strategy/blueGreen/autoPromotionEnabled
        value: true
  - target: {kind: ExternalSecret, name: school-app}
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: school/staging/app
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: rds!db-00000000-0000-0000-0000-000000000000
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: rds!db-00000000-0000-0000-0000-000000000000
      - op: replace
        path: /spec/target/template/data/DATABASE_URL
        value: "postgres://{{ .db_username }}:{{ .db_password | urlquery }}@staging-school.cluster-example.eu-west-1.rds.amazonaws.com:5432/school?sslmode=require"
