apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: school-production
resources:
  - ../../base
  - namespace.yaml
labels:
  - pairs:
      school/environment: production
    includeSelectors: false
# Build once, deploy many: the SAME digests move dev -> staging -> production. Only a promotion pull request edits these.
# The all-zero digests are placeholders; scripts/set_image.py writes real ones.
images:
  - name: school-backend
    newName: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/school-backend
    digest: sha256:0ae4384e2dd3c0255137993595ecafb6cef195af35cacb746c893420cb324d10
  - name: school-frontend
    newName: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/school-frontend
    digest: sha256:184b41db258e74e596df221b810d0bc9112a9684d3037a858a49afa3c60625f1
patches:
  - target: {kind: Rollout, name: school-backend}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target: {kind: Rollout, name: school-frontend}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target: {kind: Ingress, name: school}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: school.example.com
  - target: {kind: ConfigMap, name: school-config}
    patch: |-
      - op: replace
        path: /data/FLAG_GRADE_LETTERS
        value: "false"
  - target: {kind: Rollout, name: school-backend}
    patch: |-
      - op: replace
        path: /spec/strategy/canary/analysis/args/0/value
        value: school-production
  - target: {kind: ExternalSecret, name: school-app}
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: school/production/app
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: rds!db-00000000-0000-0000-0000-000000000000
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: rds!db-00000000-0000-0000-0000-000000000000
      - op: replace
        path: /spec/target/template/data/DATABASE_URL
        value: "postgres://{{ .db_username }}:{{ .db_password | urlquery }}@production-school.cluster-example.eu-west-1.rds.amazonaws.com:5432/school?sslmode=require"
